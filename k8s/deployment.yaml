apiVersion: apps/v1

kind: Deployment

metadata:
  name: kubernetes-cicd-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubernetes-cicd-app

  template:
    metadata:
      labels:
        app: kubernetes-cicd-app

    spec:
      containers:
        - name: kubernetes-cicd-app
          image: kandlaguntaswetha/nodejs-cicd-project:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
